<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Family Chores</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#111827}header{background:#111827;color:#fff;padding:18px;font-size:20px;font-weight:800}main{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #bbb;border-radius:9px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin:3px}.primary{background:#2563eb;color:#fff}.good{background:#16a34a;color:#fff}.bad{background:#dc2626;color:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #eee}.muted{color:#667085}.msg{padding:10px;border-radius:9px;margin-top:10px;background:#eef2ff}.error{background:#fee2e2;color:#991b1b}.code{font:700 20px monospace;letter-spacing:2px}#app{min-height:300px}
</style></head><body><header>Family Chores <span id="status" style="float:right;font-size:14px;font-weight:500">Loading…</span></header><main><div id="app"><div class="card"><h1>Family Chores</h1><p class="muted">Shared chores, points, approvals, and rewards.</p><p>Starting the app…</p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
<script>
(()=>{"use strict";const URL="https://ttmjhfizzzkkhibodmaj.supabase.co",KEY="sb_publishable_fFDLRkbBmyQKs9hrP1Zi8w_9nYuZRJD";const app=document.getElementById("app"),status=document.getElementById("status");let db,session,me,family,members=[],chores=[],rewards=[],requests=[];const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const msg=(x,e)=>'<div class="msg '+(e?"error":"")+'">'+esc(x)+'</div>';const setStatus=x=>status.textContent=x;
function showAuth(){setStatus("Sign in");app.innerHTML='<div class="card"><h1>Family Chores</h1><p class="muted">Sign in or create an account.</p><form id="auth"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" id="authBtn">Sign in</button> <button type="button" id="switch">Create account</button><div id="authMsg"></div></form></div>';let signup=false;document.getElementById("switch").onclick=function(){signup=!signup;authBtn.textContent=signup?"Create account":"Sign in";this.textContent=signup?"I already have an account":"Create account"};document.getElementById("auth").onsubmit=async e=>{e.preventDefault();authMsg.innerHTML="Working…";let r=signup?await db.auth.signUp({email:email.value,password:password.value}):await db.auth.signInWithPassword({email:email.value,password:password.value});authMsg.innerHTML=r.error?msg(r.error.message,true):msg(signup?"Account created. Check your email if confirmation is enabled.":"Signed in.");if(!r.error&&!signup)setTimeout(render,300)}}
function familyScreen(){setStatus("Choose family");app.innerHTML='<div class="card"><h1>Set up your family</h1><div class="grid"><div><h2>Create a family</h2><form id="create"><input id="familyName" placeholder="Family name" required><input id="yourName" placeholder="Your name" required><button class="primary">Create as parent</button></form><div id="createMsg"></div></div><div><h2>Join a family</h2><form id="join"><input id="joinCode" placeholder="Family code" maxlength="8" required><input id="childName" placeholder="Your name" required><button>Join as child</button></form><div id="joinMsg"></div></div></div><button id="logout">Sign out</button></div>';document.getElementById("create").onsubmit=async e=>{e.preventDefault();let r=await db.rpc("create_family",{p_name:familyName.value,p_display_name:yourName.value});createMsg.innerHTML=r.error?msg(r.error.message,true):msg("Family created. Code: "+r.data.join_code);if(!r.error)setTimeout(render,500)};document.getElementById("join").onsubmit=async e=>{e.preventDefault();let r=await db.rpc("join_family",{p_code:joinCode.value.trim(),p_display_name:childName.value});joinMsg.innerHTML=r.error?msg(r.error.message,true):msg("Joined family.");if(!r.error)setTimeout(render,500)};logout.onclick=()=>db.auth.signOut()}
async function load(){let f=family.id;let rs=await Promise.all([db.from("family_members").select("*").eq("family_id",f),db.from("chores").select("*").eq("family_id",f).order("created_at",{ascending:false}),db.from("rewards").select("*").eq("family_id",f).order("cost"),db.from("reward_requests").select("*").eq("family_id",f).order("created_at",{ascending:false})]);let bad=rs.find(x=>x.error);if(bad)throw bad.error;members=rs[0].data||[];chores=rs[1].data||[];rewards=rs[2].data||[];requests=rs[3].data||[]}const name=id=>{let x=members.find(m=>m.user_id===id);return x?x.display_name:"Unknown"};
async function render(){if(!session)return showAuth();let m=await db.from("family_members").select("*").eq("user_id",session.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)return familyScreen();me=m.data;let f=await db.from("families").select("*").eq("id",me.family_id).single();if(f.error)throw f.error;family=f.data;await load();dashboard()}
function dashboard(){let parent=me.role==="parent";setStatus(parent?"Parent":"Child");let top='<div class="card"><h1>'+ (parent?"Parent dashboard":"My chores")+'</h1><p class="muted">Family: '+esc(family.name)+'</p>'+(parent?'<p>Family code: <span class="code">'+esc(family.join_code)+'</span></p>':'<p><b>'+me.points+'</b> points</p>')+'<button id="logout">Sign out</button></div>';app.innerHTML=top+(parent?parentUI():childUI());document.getElementById("logout").onclick=()=>db.auth.signOut()}
function parentUI(){let kids=members.filter(x=>x.role==="child");return '<div class="grid"><div class="card"><h2>Add chore</h2><form id="addChore"><input id="title" placeholder="Chore" required><select id="assigned" required><option value="">Choose child</option>'+kids.map(k=>'<option value="'+k.user_id+'">'+esc(k.display_name)+'</option>').join("")+'</select><input id="points" type="number" min="1" value="10"><button class="primary">Add chore</button></form></div><div class="card"><h2>Add reward</h2><form id="addReward"><input id="rewardTitle" placeholder="Reward" required><input id="cost" type="number" min="1" value="50"><button class="primary">Add reward</button></form></div></div><div class="card"><h2>Chores</h2>'+choreRows()+'</div><div class="card"><h2>Rewards</h2>'+rewardRows(true)+'</div><div class="card"><h2>Reward requests</h2>'+requestRows()+'</div>'}
function choreRows(){if(!chores.length)return '<p class="muted">No chores yet.</p>';return chores.map(c=>'<div class="row"><div><b>'+esc(c.title)+'</b><div class="muted">'+esc(name(c.assigned_to))+' · '+c.points+' points · '+esc(c.status)+'</div></div><div>'+(c.status==="pending"?'<button class="good" onclick="act(\'approve_chore\',\''+c.id+'\')">Approve</button><button class="bad" onclick="act(\'reject_chore\',\''+c.id+'\')">Reject</button>':'')+'</div></div>').join("")}
function rewardRows(request){if(!rewards.length)return '<p class="muted">No rewards yet.</p>';return rewards.map(r=>'<div class="row"><div><b>'+esc(r.title)+'</b><div class="muted">'+r.cost+' points</div></div>'+(request?'<button onclick="rewardReq(\''+r.id+'\')">Delete</button>':'')+'</div>').join("")}
function requestRows(){let p=requests.filter(x=>x.status==="pending");if(!p.length)return '<p class="muted">No pending requests.</p>';return p.map(q=>{let r=rewards.find(x=>x.id===q.reward_id);return '<div class="row"><div><b>'+esc(r?r.title:"Reward")+'</b><div class="muted">'+esc(name(q.child_id))+'</div></div><div><button class="good" onclick="act(\'approve_reward_request\',\''+q.id+'\')">Approve</button><button class="bad" onclick="act(\'reject_reward_request\',\''+q.id+'\')">Reject</button></div></div>'}).join("")}
function childUI(){let mine=chores.filter(c=>c.assigned_to===session.user.id);return '<div class="card"><h2>My chores</h2>'+(mine.length?mine.map(c=>'<div class="row"><div><b>'+esc(c.title)+'</b><div class="muted">'+c.points+' points · '+esc(c.status)+'</div></div>'+(c.status==="todo"?'<button class="primary" onclick="act(\'complete_chore\',\''+c.id+'\')">Mark complete</button>':'')+'</div>').join(""):'<p class="muted">No chores assigned.</p>')+'</div><div class="card"><h2>Rewards</h2>'+rewardRows(false)+'</div>'}
window.act=async(fn,id)=>{let key=fn==="approve_reward_request"||fn==="reject_reward_request"?"p_request_id":"p_chore_id";let r=await db.rpc(fn,{[key]:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};window.rewardReq=async id=>{let r=await db.rpc("request_reward",{p_reward_id:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};
document.addEventListener("submit",async e=>{if(e.target.id==="addChore"){e.preventDefault();let r=await db.from("chores").insert({family_id:family.id,title:title.value.trim(),assigned_to:assigned.value,points:+points.value,created_by:session.user.id});if(r.error)alert(r.error.message);else{await load();dashboard()}}if(e.target.id==="addReward"){e.preventDefault();let r=await db.from("rewards").insert({family_id:family.id,title:rewardTitle.value.trim(),cost:+cost.value,created_by:session.user.id});if(r.error)alert(r.error.message);else{await load();dashboard()}}});
async function start(){try{if(!window.supabase)throw new Error("The Supabase library did not load. Refresh the page or try another browser.");db=window.supabase.createClient(URL,KEY);let r=await db.auth.getSession();session=r.data.session;await render();db.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(()=>render().catch(showError),0)})}catch(e){showError(e)}}function showError(e){setStatus("Error");app.innerHTML='<div class="card"><h1>Family Chores</h1>'+msg(e.message||String(e),true)+'<button onclick="location.reload()">Reload</button></div>'}start();})();
</script></body></html>
