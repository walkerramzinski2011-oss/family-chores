<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050605"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Family Chores</title><style>
:root{
  --bg:#050605;--surface:#0d100e;--surface-2:#121612;--surface-3:#171c18;
  --text:#f2f5f2;--muted:#89928c;--border:#252c27;--accent:#a7d98b;
  --accent-dark:#2f4938;--success:#91d46f;--danger:#c77979;
  --shadow:0 10px 30px rgba(0,0,0,.32)
}
*{box-sizing:border-box}
html,body{min-height:100%;background:var(--bg)}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050605;color:var(--text);line-height:1.45}
button,input,select{font:inherit}
header{display:none}
main{max-width:none;margin:0;padding:0;min-height:100vh}
#app{min-height:100vh}
.app-shell{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr);background:var(--bg)}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px 18px;border-right:1px solid var(--border);background:#080a09;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 28px}
.brand-mark{width:38px;height:38px;border:1px solid #334238;border-radius:12px;background:linear-gradient(145deg,#18231c,#0d120f);display:grid;place-items:center;color:var(--accent);font-weight:900;font-size:19px}
.brand-title{font-size:18px;font-weight:850;letter-spacing:-.03em}
.brand-sub{font-size:10px;color:#68716b;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.nav{display:grid;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:11px;color:#9da69f;font-size:14px;font-weight:650}
.nav-item.active{background:#203226;color:#d9f1cf;box-shadow:inset 0 0 0 1px #2e4938}
.nav-icon{width:20px;text-align:center;font-size:16px}
.sidebar-bottom{margin-top:auto}
.install-mini{border:1px solid #273229;background:#0f140f;border-radius:13px;padding:14px;color:#aeb7b0;font-size:12px}
.install-mini b{display:block;color:#dce9dc;margin-bottom:3px}
.dashboard-main{min-width:0}
.topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(5,6,5,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.eyebrow{font-size:12px;color:#707a73;text-transform:uppercase;letter-spacing:.12em;font-weight:750}
.topbar-title{font-size:15px;font-weight:750;margin-top:2px}
.profile{display:flex;align-items:center;gap:10px;color:#cbd2cc;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#18221b;border:1px solid #344239;display:grid;place-items:center;color:var(--accent);font-weight:800}
.dashboard-content{padding:30px 34px 48px;max-width:1400px;margin:0 auto}
.welcome{border:1px solid var(--border);background:linear-gradient(135deg,#101510,#0b0e0c);border-radius:15px;padding:24px 26px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.welcome h1{margin:0 0 5px;font-size:26px;letter-spacing:-.04em}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.welcome-mark{width:52px;height:52px;border-radius:15px;border:1px solid #344238;background:#111912;color:var(--accent);display:grid;place-items:center;font-size:25px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{border:1px solid var(--border);background:var(--surface);border-radius:13px;padding:18px 20px}
.stat-label{color:#858e88;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.stat-value{font-size:29px;font-weight:850;letter-spacing:-.04em;margin-top:6px}
.stat-note{color:#69736c;font-size:12px;margin-top:3px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:18px;align-items:start}
.main-column,.side-column{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin:0}
.card h1{margin:0 0 8px;font-size:27px;letter-spacing:-.04em}
.card h2{margin:0 0 15px;font-size:16px;letter-spacing:-.02em}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-head h2{margin:0}
.section-kicker{font-size:11px;color:#707a73;text-transform:uppercase;letter-spacing:.1em;font-weight:750}
label{display:block;font-size:12px;font-weight:700;color:#8a948d;margin-top:9px}
input,select{width:100%;padding:11px 12px;margin:6px 0 11px;border:1px solid #29312b;border-radius:9px;background:#090c0a;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5f6862}
input:focus,select:focus{border-color:#557a5f;box-shadow:0 0 0 3px rgba(113,157,107,.12)}
button{padding:10px 14px;border:1px solid #2b332d;border-radius:9px;font:inherit;font-weight:750;cursor:pointer;margin:3px 4px 3px 0;transition:transform .12s,background .12s,border-color .12s}
button:hover{transform:translateY(-1px)}
button.primary{background:#9fd47f;color:#0b110c;border-color:#9fd47f;box-shadow:0 4px 14px rgba(120,174,95,.12)}
button.primary:hover{background:#b1e391}
button.good{background:#19311f;color:#bce7a6;border-color:#2c4d34}
button.bad{background:#2a1717;color:#e3aaaa;border-color:#4b2a2a}
button:not(.primary):not(.good):not(.bad){background:#121612;color:#c7cec8}
.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-top:1px solid #202720}
.row:first-child{border-top:0}
.row b{font-size:14px}
.muted{color:var(--muted)}
.code{display:inline-flex;align-items:center;padding:6px 9px;border:1px solid #35443a;background:#0b100c;border-radius:7px;color:#bce5a8;font-weight:800;letter-spacing:.12em}
.msg{padding:10px 12px;border-radius:9px;margin-top:10px;background:var(--surface-2);border:1px solid var(--border);color:#b7c0b9}
.error{background:#241515;color:#e5aaaa;border-color:#4b2a2a}
#logout{width:100%;margin-top:12px}
.side-card{background:#0a0d0b}
.quick-value{font-size:24px;font-weight:850;margin:4px 0}
.progress{height:7px;border-radius:999px;background:#202720;overflow:hidden;margin-top:10px}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.empty{padding:10px 0}
@media(max-width:900px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px}
  .brand{padding:4px 6px 12px}
  .nav{grid-template-columns:repeat(4,1fr)}
  .nav-item{justify-content:center;padding:9px 7px;font-size:12px}
  .nav-item .nav-label{display:none}
  .sidebar-bottom{display:none}
  .topbar{padding:0 18px}
  .dashboard-content{padding:22px 16px 38px}
}
@media(max-width:650px){
  .stats{grid-template-columns:1fr}
  .dashboard-grid{grid-template-columns:1fr}
  .welcome{padding:20px}
  .welcome h1{font-size:23px}
  .topbar{height:64px}
  .row{align-items:flex-start;flex-direction:column}
  .row>div:last-child{width:100%}
  .row button{margin-top:6px}
}
</style></head><body><header>Family Chores <span id="status" style="float:right;font-size:14px;font-weight:500">Loading…</span></header><main><div id="app"><div class="card"><h1>Family Chores</h1><p class="muted">Shared chores, points, approvals, and rewards.</p><p>Starting the app…</p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
<script>
(()=>{"use strict";const URL="https://ttmjhfizzzkkhibodmaj.supabase.co",KEY="sb_publishable_fFDLRkbBmyQKs9hrP1Zi8w_9nYuZRJD";const app=document.getElementById("app"),status=document.getElementById("status");let db,session,me,family,members=[],chores=[],rewards=[],requests=[];const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const msg=(x,e)=>'<div class="msg '+(e?"error":"")+'">'+esc(x)+'</div>';const setStatus=x=>status.textContent=x;
function showAuth(){setStatus("Sign in");app.innerHTML='<div class="card"><h1>Family Chores</h1><p class="muted">Sign in or create an account.</p><form id="auth"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" id="authBtn">Sign in</button> <button type="button" id="switch">Create account</button><div id="authMsg"></div></form></div>';let signup=false;document.getElementById("switch").onclick=function(){signup=!signup;authBtn.textContent=signup?"Create account":"Sign in";this.textContent=signup?"I already have an account":"Create account"};document.getElementById("auth").onsubmit=async e=>{e.preventDefault();authMsg.innerHTML="Working…";let r=signup?await db.auth.signUp({email:email.value,password:password.value}):await db.auth.signInWithPassword({email:email.value,password:password.value});authMsg.innerHTML=r.error?msg(r.error.message,true):msg(signup?"Account created. Check your email if confirmation is enabled.":"Signed in.");if(!r.error&&!signup)setTimeout(render,300)}}
function familyScreen(){setStatus("Choose family");app.innerHTML='<div class="card"><h1>Set up your family</h1><div class="grid"><div><h2>Create a family</h2><form id="create"><input id="familyName" placeholder="Family name" required><input id="yourName" placeholder="Your name" required><button class="primary">Create as parent</button></form><div id="createMsg"></div></div><div><h2>Join a family</h2><form id="join"><input id="joinCode" placeholder="Family code" maxlength="8" required><input id="childName" placeholder="Your name" required><button>Join as child</button></form><div id="joinMsg"></div></div></div><button id="logout">Sign out</button></div>';document.getElementById("create").onsubmit=async e=>{e.preventDefault();let r=await db.rpc("create_family",{p_name:familyName.value,p_display_name:yourName.value});createMsg.innerHTML=r.error?msg(r.error.message,true):msg("Family created. Code: "+r.data.join_code);if(!r.error)setTimeout(render,500)};document.getElementById("join").onsubmit=async e=>{e.preventDefault();let r=await db.rpc("join_family",{p_code:joinCode.value.trim(),p_display_name:childName.value});joinMsg.innerHTML=r.error?msg(r.error.message,true):msg("Joined family.");if(!r.error)setTimeout(render,500)};logout.onclick=()=>db.auth.signOut()}
async function load(){let f=family.id;let rs=await Promise.all([db.from("family_members").select("*").eq("family_id",f),db.from("chores").select("*").eq("family_id",f).order("created_at",{ascending:false}),db.from("rewards").select("*").eq("family_id",f).order("cost"),db.from("reward_requests").select("*").eq("family_id",f).order("created_at",{ascending:false})]);let bad=rs.find(x=>x.error);if(bad)throw bad.error;members=rs[0].data||[];chores=rs[1].data||[];rewards=rs[2].data||[];requests=rs[3].data||[]}const name=id=>{let x=members.find(m=>m.user_id===id);return x?x.display_name:"Unknown"};
async function render(){if(!session)return showAuth();let m=await db.from("family_members").select("*").eq("user_id",session.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)return familyScreen();me=m.data;let f=await db.from("families").select("*").eq("id",me.family_id).single();if(f.error)throw f.error;family=f.data;await load();dashboard()}
function dashboard(){let parent=me.role==="parent";setStatus(parent?"Parent":"Child");let top='<div class="card"><h1>'+ (parent?"Parent dashboard":"My chores")+'</h1><p class="muted">Family: '+esc(family.name)+'</p>'+(parent?'<p>Family code: <span class="code">'+esc(family.join_code)+'</span></p>':'<p><b>'+me.points+'</b> points</p>')+'<button id="logout">Sign out</button></div>';app.innerHTML=top+(parent?parentUI():childUI());document.getElementById("logout").onclick=()=>db.auth.signOut()}
function parentUI(){let kids=members.filter(x=>x.role==="child");return '<div class="grid"><div class="card"><h2>Add chore</h2><form id="addChore"><input id="title" placeholder="Chore" required><select id="assigned" required><option value="">Choose child</option>'+kids.map(k=>'<option value="'+k.user_id+'">'+esc(k.display_name)+'</option>').join("")+'</select><input id="points" type="number" min="1" value="10"><label>Due date<input id="dueDate" type="date"></label><button class="primary">Add chore</button></form></div><div class="card"><h2>Add reward</h2><form id="addReward"><input id="rewardTitle" placeholder="Reward" required><input id="cost" type="number" min="1" value="50"><button class="primary">Add reward</button></form></div></div><div class="card"><h2>Chores</h2>'+choreRows()+'</div><div class="card"><h2>Rewards</h2>'+rewardRows(true)+'</div><div class="card"><h2>Reward requests</h2>'+requestRows()+'</div>'}
function choreRows(){if(!chores.length)return '<p class="muted">No chores yet.</p>';return chores.map(c=>'<div class="row"><div><b>'+esc(c.title)+'</b><div class="muted">'+esc(name(c.assigned_to))+' · '+c.points+' points · '+esc(c.status)+'</div></div><div>'+(c.status==="pending"?'<button class="good" onclick="act(\'approve_chore\',\''+c.id+'\')">Approve</button><button class="bad" onclick="act(\'reject_chore\',\''+c.id+'\')">Reject</button>':'')+'</div></div>').join("")}
function rewardRows(request){if(!rewards.length)return '<p class="muted">No rewards yet.</p>';return rewards.map(r=>'<div class="row"><div><b>'+esc(r.title)+'</b><div class="muted">'+r.cost+' points</div></div>'+(request?'<button onclick="rewardReq(\''+r.id+'\')">Delete</button>':'')+'</div>').join("")}
function requestRows(){let p=requests.filter(x=>x.status==="pending");if(!p.length)return '<p class="muted">No pending requests.</p>';return p.map(q=>{let r=rewards.find(x=>x.id===q.reward_id);return '<div class="row"><div><b>'+esc(r?r.title:"Reward")+'</b><div class="muted">'+esc(name(q.child_id))+'</div></div><div><button class="good" onclick="act(\'approve_reward_request\',\''+q.id+'\')">Approve</button><button class="bad" onclick="act(\'reject_reward_request\',\''+q.id+'\')">Reject</button></div></div>'}).join("")}
function childUI(){let mine=chores.filter(c=>c.assigned_to===session.user.id);return '<div class="card"><h2>My chores</h2>'+(mine.length?mine.map(c=>'<div class="row"><div><b>'+esc(c.title)+'</b><div class="muted">'+c.points+' points · '+esc(c.status)+'</div></div>'+(c.status==="todo"?'<button class="primary" onclick="act(\'complete_chore\',\''+c.id+'\')">Mark complete</button>':'')+'</div>').join(""):'<p class="muted">No chores assigned.</p>')+'</div><div class="card"><h2>Rewards</h2>'+rewardRows(false)+'</div>'}
window.act=async(fn,id)=>{let key=fn==="approve_reward_request"||fn==="reject_reward_request"?"p_request_id":"p_chore_id";let r=await db.rpc(fn,{[key]:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};window.rewardReq=async id=>{let r=await db.rpc("request_reward",{p_reward_id:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};
document.addEventListener("submit",async e=>{if(e.target.id==="addChore"){e.preventDefault();let r=await db.from("chores").insert({family_id:family.id,title:title.value.trim(),assigned_to:assigned.value,points:+points.value,due_date:dueDate.value||null,created_by:session.user.id});if(r.error)alert(r.error.message);else{await load();dashboard()}}if(e.target.id==="addReward"){e.preventDefault();let r=await db.from("rewards").insert({family_id:family.id,title:rewardTitle.value.trim(),cost:+cost.value,created_by:session.user.id});if(r.error)alert(r.error.message);else{await load();dashboard()}}});
async function start(){try{if(!window.supabase)throw new Error("The Supabase library did not load. Refresh the page or try another browser.");db=window.supabase.createClient(URL,KEY);let r=await db.auth.getSession();session=r.data.session;await render();db.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(()=>render().catch(showError),0)})}catch(e){showError(e)}}function showError(e){setStatus("Error");app.innerHTML='<div class="card"><h1>Family Chores</h1>'+msg(e.message||String(e),true)+'<button onclick="location.reload()">Reload</button></div>'}start();})();
</script></body></html>
