function showAuth(){setStatus("Sign in");app.innerHTML='<div class="card"><h1>Family Chores</h1><p class="muted">Sign in or create an account.</p><form id="auth"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" id="authBtn">Sign in</button> <button type="button" id="switch">Create account</button><div id="authMsg"></div></form></div>';let signup=false;document.getElementById("switch").onclick=function(){signup=!signup;authBtn.textContent=signup?"Create account":"Sign in";this.textContent=signup?"I already have an account":"Create account"};document.getElementById("auth").onsubmit=async e=>{e.preventDefault();authMsg.innerHTML="Workingâ¦";let r=signup?await db.auth.signUp({email:email.value,password:password.value}):await db.auth.signInWithPassword({email:email.value,password:password.value});authMsg.innerHTML=r.error?msg(r.error.message,true):msg(signup?"Account created. Check your email if confirmation is enabled.":"Signed in.");if(!r.error&&!signup)setTimeout(render,300)}}

function choreRows(){if(!chores.length)return '<p class="muted">No chores yet.</p>';return chores.map(c=>'<div class="row"><div><b>'+esc(c.title)+'</b><div class="muted">'+esc(name(c.assigned_to))+' Â· '+c.points+' points Â· '+esc(c.status)+' Â· '+esc((c.recurrence||'once').replace(/^./,x=>x.toUpperCase()))+'</div></div><div>'+(c.status==="pending"?'<button class="good" onclick="act(\'approve_chore\',\''+c.id+'\')">Approve</button><button class="bad" onclick="act(\'reject_chore\',\''+c.id+'\')">Reject</button>':'')+'</div></div>').join("")}

window.act=async(fn,id)=>{let key=fn==="approve_reward_request"||fn==="reject_reward_request"?"p_request_id":"p_chore_id";let r=await db.rpc(fn,{[key]:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};window.parentDeleteReward=async id=>{if(!confirm("Delete this reward?"))return;let r=await db.rpc("delete_reward",{p_reward_id:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};
window.rewardReq=async id=>{let r=await db.rpc("request_reward",{p_reward_id:id});if(r.error)alert(r.error.message);else{await load();dashboard()}};
document.addEventListener("submit",async e=>{if(e.target.id==="addChore"){e.preventDefault();let r=await db.from("chores").insert({family_id:family.id,title:title.value.trim(),assigned_to:assigned.value,points:+points.value,due_date:dueDate.value||null,created_by:session.user.id,recurrence:(document.querySelector('input[name="recurrence"]:checked')||{value:"once"}).value});if(r.error)alert(r.error.message);else{await load();dashboard()}}if(e.target.id==="addReward"){e.preventDefault();let r=await db.from("rewards").insert({family_id:family.id,title:rewardTitle.value.trim(),cost:+cost.value,created_by:session.user.id});if(r.error)alert(r.error.message);else{await load();dashboard()}}});
async function start(){try{if(!window.supabase)throw new Error("The Supabase library did not load. Refresh the page or try another browser.");db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.localStorage}});let r=await db.auth.getSession();session=r.data.session;await render();db.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(()=>render().catch(showError),0)})}catch(e){showError(e)}}function showError(e){setStatus("Error");app.innerHTML='<div class="card"><h1>Family Chores</h1>'+msg(e.message||String(e),true)+'<button onclick="location.reload()">Reload</button></div>'}start();})();
</script></body></html>
