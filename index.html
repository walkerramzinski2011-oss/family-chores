<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Family Chores</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--a:#2563eb;--good:#166534;--bad:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111827;color:#fff;padding:16px 20px}.bar,main{max-width:1050px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:20px;font-weight:800}.pill{font-size:12px;background:#253047;padding:7px 10px;border-radius:99px}main{padding:22px 16px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.hero h1{margin:0 0 4px;font-size:29px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px #1018280d}.stat{font-size:27px;font-weight:800}.label{font-size:13px;color:var(--muted)}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:9px}.row h3,.row p{margin:0}.row p{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;background:#e8edf5;color:#344054}.primary{background:var(--a);color:#fff}.good{background:#dcfce7;color:var(--good)}.danger{background:#fee2e2;color:var(--bad)}.ghost{background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.5}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}form{display:grid;gap:9px}input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;font-weight:700}.empty{text-align:center;padding:20px;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px}.auth{max-width:440px;margin:65px auto;padding:0 16px}.auth h1{font-size:31px;margin:0}.auth h2{font-size:18px;margin:4px 0}.error{color:var(--bad);font-size:13px}.success{color:var(--good);font-size:13px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:9}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.formgrid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ttmjhfizzzkkhibodmaj.supabase.co',KEY='sb_publishable_fFDLRkbBmyQKs9hrP1Zi8w_9nYuZRJD',db=supabase.createClient(URL,KEY);
let session,me,family,members=[],chores=[],rewards=[],requests=[],mode='in';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),toast=s=>{let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)},err=s=>'<div class="error">'+esc(s)+'</div>';
async function init(){session=(await db.auth.getSession()).data.session;await route();db.auth.onAuthStateChange(async(_,s)=>{session=s;await route()})}
async function route(){if(!session)return auth();let q=await db.from('family_members').select('*').eq('user_id',session.user.id).maybeSingle();if(!q.data)return onboard();me=q.data;family=(await db.from('families').select('*').eq('id',me.family_id).single()).data;await load();app()}
async function load(){let f=me.family_id;let [a,b,c,d]=await Promise.all([db.from('family_members').select('*').eq('family_id',f).order('role').order('display_name'),db.from('chores').select('*').eq('family_id',f).order('created_at',{ascending:false}),db.from('rewards').select('*').eq('family_id',f).order('cost'),db.from('reward_requests').select('*').eq('family_id',f).order('created_at',{ascending:false})]);members=a.data||[];chores=b.data||[];rewards=c.data||[];requests=d.data||[]}
function auth(){document.getElementById('root').innerHTML='<div class="auth"><div class="card"><h1>Family Chores</h1><p class="muted">Shared chores, approvals, points, and rewards.</p><form onsubmit="authGo(event)"><label>Email<input id="email" type="email" required></label><label>Password<input id="pass" type="password" minlength="6" required></label>'+(mode==='up'?'<label>Your name<input id="aname" maxlength="60" required></label>':'')+'<button class="btn primary">'+(mode==='up'?'Create account':'Sign in')+'</button><div id="amsg"></div></form><div style="margin-top:10px"><button class="btn ghost" onclick="mode=mode===\'up\'?\'in\':\'up\';auth()">'+(mode==='up'?'I already have an account':'Create a new account')+'</button></div></div></div>'}
async function authGo(e){e.preventDefault();let box=document.getElementById('amsg');box.textContent='Working...';let r=mode==='up'?await db.auth.signUp({email:email.value,password:pass.value}):await db.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error){box.innerHTML=err(r.error.message);return}if(mode==='up'){localStorage.fcName=aname.value;box.innerHTML='<div class="success">Account created. If confirmation is required, confirm your email, then sign in.</div>';mode='in'}else{toast('Signed in')}}
function onboard(){document.getElementById('root').innerHTML='<div class="auth"><div class="card"><h1>Set up your family</h1><p class="muted">Create a family as a parent, or join one as a child.</p><h2>Create family</h2><form onsubmit="createFam(event)"><input id="fname" placeholder="Family name" maxlength="80" required><input id="pname" placeholder="Your name" maxlength="60" required><button class="btn primary">Create as parent</button><div id="cmsg"></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>Join family</h2><form onsubmit="joinFam(event)"><input id="jcode" placeholder="Family code" maxlength="8" required><input id="jname" placeholder="Your name" maxlength="60" required><button class="btn">Join as child</button><div id="jmsg"></div></form><button class="btn ghost" style="margin-top:14px" onclick="db.auth.signOut()">Sign out</button></div></div>'}
async function createFam(e){e.preventDefault();let r=await db.rpc('create_family',{p_name:fname.value,p_display_name:pname.value});if(r.error){cmsg.innerHTML=err(r.error.message);return}alert('Family code: '+r.data.join_code+'\nShare this with your children.');await route()}
async function joinFam(e){e.preventDefault();let r=await db.rpc('join_family',{p_code:jcode.value,p_display_name:jname.value});if(r.error){jmsg.innerHTML=err(r.error.message);return}await route()}
const name=id=>members.find(x=>x.user_id===id)?.display_name||'Unknown';
function app(){let parent=me.role==='parent';document.getElementById('root').innerHTML='<header><div class="bar"><div class="logo">Family Chores</div><div class="pill">'+esc(family.name)+' · '+(parent?'Parent':'Child')+'</div><button class="btn ghost" onclick="db.auth.signOut()">Sign out</button></div></header><main><div class="hero"><div><h1>'+esc(parent?'Parent dashboard':'My chores')+'</h1><div class="muted">Your family data is stored online.</div></div>'+(parent?'<div class="pill">Code: '+esc(family.join_code)+'</div>':'')+'</div><div class="grid"><div class="card"><div class="stat">'+(parent?chores.length:me.points)+'</div><div class="label">'+(parent?'Total chores':'Your points')+'</div></div><div class="card"><div class="stat">'+chores.filter(x=>x.status==='pending').length+'</div><div class="label">Waiting for approval</div></div><div class="card"><div class="stat">'+rewards.length+'</div><div class="label">Rewards</div></div></div>'+(parent?parentUI():childUI())+'</main>'}
function parentUI(){let kids=members.filter(x=>x.role==='child');return '<div class="grid section"><div class="card"><h2>Add chore</h2><form onsubmit="addChore(event)"><input id="ct" placeholder="Chore name" required maxlength="120"><div class="formgrid"><select id="ca" required><option value="">Assign child...</option>'+kids.map(x=>'<option value="'+x.user_id+'">'+esc(x.display_name)+'</option>').join('')+'</select><input id="cp" type="number" min="1" max="1000" value="10"></div><input id="cd" type="date"><button class="btn primary">Add chore</button></form></div><div class="card"><h2>Add reward</h2><form onsubmit="addReward(event)"><input id="rt" placeholder="Reward name" required maxlength="120"><input id="rc" type="number" min="1" max="100000" value="50"><button class="btn primary">Add reward</button></form></div><div class="card"><h2>Family</h2><p><b>Family code:</b> '+esc(family.join_code)+'</p>'+members.map(x=>'<div class="row"><div><b>'+esc(x.display_name)+'</b><p>'+x.role+' · '+x.points+' points</p></div></div>').join('')+'</div></div><div class="card section"><h2>Chore approvals</h2>'+ (chores.length?chores.map(c=>'<div class="row"><div><h3>'+esc(c.title)+'</h3><p>'+esc(name(c.assigned_to))+' · '+c.points+' points · '+(c.due_date||'No due date')+'</p></div><div class="actions">'+(c.status==='pending'?'<button class="btn good" onclick="approve(\''+c.id+'\')">Approve</button><button class="btn danger" onclick="reject(\''+c.id+'\')">Reject</button>':'<span class="pill">'+c.status+'</span>')+'<button class="btn ghost" onclick="delChore(\''+c.id+'\')">Delete</button></div></div>').join(''):'<div class="empty">No chores yet.</div>')+'</div><div class="card section"><h2>Rewards</h2>'+(rewards.length?rewards.map(r=>'<div class="row"><div><h3>'+esc(r.title)+'</h3><p>'+r.cost+' points</p></div><button class="btn ghost" onclick="delReward(\''+r.id+'\')">Delete</button></div>').join(''):'<div class="empty">No rewards yet.</div>')+'</div><div class="card section"><h2>Reward requests</h2>'+ (requests.filter(x=>x.status==='pending').length?requests.filter(x=>x.status==='pending').map(q=>{let r=rewards.find(x=>x.id===q.reward_id);return '<div class="row"><div><h3>'+esc(r?.title||'Reward')+'</h3><p>'+esc(name(q.child_id))+' · '+(r?.cost||0)+' points</p></div><div class="actions"><button class="btn good" onclick="approveReq(\''+q.id+'\')">Approve</button><button class="btn danger" onclick="rejectReq(\''+q.id+'\')">Reject</button></div></div>'}).join(''):'<div class="empty">No pending requests.</div>')+'</div>'}
function childUI(){let mine=chores.filter(x=>x.assigned_to===session.user.id);return '<div class="card section"><h2>My chores</h2>'+(mine.length?mine.map(c=>'<div class="row"><div><h3>'+esc(c.title)+'</h3><p>'+c.points+' points · '+(c.due_date||'No due date')+'</p></div><div class="actions"><span class="pill">'+c.status+'</span>'+(c.status==='todo'?'<button class="btn primary" onclick="complete(\''+c.id+'\')">Mark complete</button>':'')+'</div></div>').join(''):'<div class="empty">No chores assigned.</div>')+'</div><div class="card section"><h2>Rewards</h2>'+(rewards.length?rewards.map(r=>'<div class="row"><div><h3>'+esc(r.title)+'</h3><p>Costs '+r.cost+' points</p></div><button class="btn '+(me.points>=r.cost?'primary':'ghost')+'" '+(me.points<r.cost?'disabled':'')+' onclick="requestReward(\''+r.id+'\')">'+(me.points>=r.cost?'Request':'Need more points')+'</button></div>').join(''):'<div class="empty">No rewards yet.</div>')+'</div>'}
async function refresh(msg){if(msg)toast(msg);await load();app()}
async function addChore(e){e.preventDefault();let r=await db.from('chores').insert({family_id:me.family_id,title:ct.value.trim(),assigned_to:ca.value,points:+cp.value,due_date:cd.value||null,created_by:session.user.id});if(r.error)toast(r.error.message);else refresh('Chore added')}
async function addReward(e){e.preventDefault();let r=await db.from('rewards').insert({family_id:me.family_id,title:rt.value.trim(),cost:+rc.value,created_by:session.user.id});if(r.error)toast(r.error.message);else refresh('Reward added')}
async function call(fn,key,id,msg){let r=await db.rpc(fn,{[key]:id});if(r.error)toast(r.error.message);else refresh(msg)}
const complete=id=>call('complete_chore','p_chore_id',id,'Sent for approval'),approve=id=>call('approve_chore','p_chore_id',id,'Approved'),reject=id=>call('reject_chore','p_chore_id',id,'Sent back'),approveReq=id=>call('approve_reward_request','p_request_id',id,'Reward approved'),rejectReq=id=>call('reject_reward_request','p_request_id',id,'Request rejected'),requestReward=id=>call('request_reward','p_reward_id',id,'Reward requested');
async function delChore(id){let r=await db.from('chores').delete().eq('id',id);if(r.error)toast(r.error.message);else refresh('Chore deleted')}
async function delReward(id){let r=await db.from('rewards').delete().eq('id',id);if(r.error)toast(r.error.message);else refresh('Reward deleted')}
init();
</script></body></html>
